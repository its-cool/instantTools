name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Windows 生成的 package-lock.json 缺少 Linux 平台的原生可选依赖，
        # 直接 npm ci 会报 @rollup/rollup-linux-x64-gnu 缺失（npm/cli#4828）。
        # 删除 lockfile 后 npm install 会在 Linux 上重新解析并安装正确的平台包。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          BASE_URL: /instantTools/
          # Supabase 公开密钥（publishable key），配合 RLS 可安全暴露在前端
          VITE_SUPABASE_URL: https://qnogdvalquhewgpfnoei.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_scUDNg2Vsmno26wrpP1iCQ_ZB0KGqY4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
